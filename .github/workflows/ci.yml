name: CI

on:
  push:
    branches: [main, rewrite, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Lint (gofmt, go vet, staticcheck, gopls)
        run: make lint
      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Build
        run: make build && ./bin/zelta version

  # The ZFS jobs stay on Ubuntu 24.04, as in the awk repo: 26.04 replaces sudo
  # with sudo-rs, which ignores -E and rejects sudoers wildcards, and broke
  # the awk ShellSpec job.
  integration-linux:
    name: Integration (Linux OpenZFS)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install OpenZFS
        run: sudo apt-get update && sudo apt-get install -y zfsutils-linux man-db
      - name: End-to-end tests
        run: sudo -E env "PATH=$PATH" ZELTA_INTEGRATION=1 go test -tags integration -count=1 -v ./test/integration/
      - name: Differential tests against Zelta (Awk)
        run: |
          git clone --depth 1 --branch main https://github.com/bell-tower/zelta.git /tmp/zelta-awk
          sudo apt-get install -y mawk
          sudo -E env "PATH=$PATH" ZELTA_INTEGRATION=1 ZELTA_AWK_ROOT=/tmp/zelta-awk ZELTA_AWK=mawk \
            go test -tags integration -count=1 -run TestDifferential -v ./test/integration/

  shellspec:
    name: ShellSpec compatibility suite
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zfsutils-linux man-db jq
      # run_shellspec.sh fetches its pinned ShellSpec release.
      - name: Run suite (local endpoints)
        run: sudo -E env "PATH=$PATH" ./test/run_shellspec.sh standard
      - name: Run suite (remote endpoints through a fake ssh)
        run: sudo -E env "PATH=$PATH" ./test/run_shellspec.sh remote

  freebsd:
    name: FreeBSD ${{ matrix.release }} (unit and integration)
    # vmactions recommends ubuntu-latest as the VM host.
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      matrix:
        release: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@v7
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y go git
          run: |
            go test ./...
            ZELTA_INTEGRATION=1 go test -tags integration -count=1 -v ./test/integration/
